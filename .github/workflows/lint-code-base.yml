name: Lint Code Base

on:
  pull_request: null

permissions: {}

jobs:
  run-lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter@4e51915f4a812abf59fed160bb14595c0a38a9e7 # v6
        env:
          DEFAULT_BRANCH: main
          FILTER_REGEX_EXCLUDE: eng/common/.*|eng/readme-templates/.*|\.github/agents/.*|\.github/workflows/shared/pat_pool\.README\.md|\.github/workflows/shared/pat_pool\.md|\.github/workflows/triage\.md|\.github/workflows/.*\.lock\.yml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_MARKDOWN: true
